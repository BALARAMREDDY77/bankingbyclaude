######################################################################
# Docker Compose — Enterprise AI Banking Platform
# Services: postgres, redis, backend, frontend, nginx
######################################################################

name: enterprise-ai-banking

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  APP_NAME: ${APP_NAME:-"Enterprise AI Banking Platform"}
  APP_VERSION: ${APP_VERSION:-1.0.0}

x-backend-env: &backend-env
  <<: *common-env
  APP_SECRET_KEY: ${APP_SECRET_KEY}
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: ${DATABASE_NAME:-banking_platform}
  DATABASE_USER: ${DATABASE_USER:-banking_user}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
  DATABASE_ECHO: ${DATABASE_ECHO:-false}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: banking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-banking_platform}
      POSTGRES_USER: ${DATABASE_USER:-banking_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"                      # Expose for local dev tools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-banking_user} -d ${DATABASE_NAME:-banking_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: banking_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"                      # Expose for local dev tools
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: banking_backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app                    # Live reload in development
      - backend_logs:/var/log/banking-platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend-net
      - proxy-net

  # ── React Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_APP_NAME: ${APP_NAME:-"Enterprise AI Banking"}
        VITE_APP_ENV: ${APP_ENV:-development}
    container_name: banking_frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy-net

  # ── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: banking_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy-net


# ── Networks ────────────────────────────────────────────────
networks:
  backend-net:
    driver: bridge
    name: banking_backend_net
  proxy-net:
    driver: bridge
    name: banking_proxy_net


# ── Volumes ─────────────────────────────────────────────────
volumes:
  postgres_data:
    name: banking_postgres_data
  redis_data:
    name: banking_redis_data
  backend_logs:
    name: banking_backend_logs
