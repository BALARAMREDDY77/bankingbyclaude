name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Backend Tests ─────────────────────────────────────────
  backend-test:
    name: Backend — Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        working-directory: backend
        run: ruff check .

      - name: Type check with mypy
        working-directory: backend
        run: mypy app/ --ignore-missing-imports

      - name: Run unit tests
        working-directory: backend
        env:
          APP_ENV: development
          APP_SECRET_KEY: ci-test-secret-key
          DATABASE_HOST: localhost
          DATABASE_NAME: banking_test
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_pass
          REDIS_HOST: localhost
          REDIS_PASSWORD: ""
        run: pytest tests/unit/ -m unit --cov=app --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend

  # ── Frontend Tests ────────────────────────────────────────
  frontend-test:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --frozen-lockfile

      - name: TypeScript type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_APP_ENV: production
        run: npm run build

  # ── Docker Build Validation ───────────────────────────────
  docker-build:
    name: Docker — Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t banking-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t banking-frontend:ci ./frontend
        env:
          VITE_API_BASE_URL: /api/v1
